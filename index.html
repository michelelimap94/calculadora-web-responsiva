<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Web Responsiva</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome para ícones -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="calculadora">
    <h2>CALCULADORA WEB</h2>

    <input type="number" id="num1" placeholder="Digite o primeiro número">
    <input type="number" id="num2" placeholder="Digite o segundo número">

    <div class="botoes">
      <button id="soma">+</button>
      <button id="subtrai">-</button>
      <button id="multiplica">*</button>
      <button id="divide">/</button>
      <button id="limpar" class="limpar">Limpar</button>
      <button id="modo" class="modo">🌙 Modo</button>
    </div>

    <p id="resultado">Resultado:</p>
    <div id="historico">
      <strong>Histórico:</strong>
      <ul id="lista-historico"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
